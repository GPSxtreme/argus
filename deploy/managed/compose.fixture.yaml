name: argus
services:
  argus:
    image: ${ARGUS_IMAGE}
    env_file:
      - path: secrets.env
        format: raw
    environment:
      ARGUS_CONFIG: /app/argus.yaml
      ARGUS_ROLE: all
    volumes:
      - ./argus.yaml:/app/argus.yaml:ro
      - argus-data:/app/data
    ports:
      - "${ARGUS_API_PORT}:${ARGUS_API_PORT}"
    networks: [argus-private, argus-egress]
    restart: unless-stopped
  searxng:
    image: ${SEARXNG_IMAGE}
    env_file:
      - path: searxng/secrets.env
        format: raw
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks: [argus-private, argus-egress]
    restart: unless-stopped
networks:
  argus-private:
    internal: true
  argus-egress: {}
volumes:
  argus-data:
