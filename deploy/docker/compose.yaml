services:
  argus:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      ARGUS_CONFIG: /app/argus.yaml
      ARGUS_ROLE: all
    ports:
      - "8788:8788"
    volumes:
      - ../../argus.yaml:/app/argus.yaml:ro
      - argus-data:/app/data

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    profiles: ["search"]
    ports:
      - "8080:8080"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argus-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  argus-data:
  postgres-data:
