name: Web

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @argus/web generate
      - run: pnpm vitest run apps/web/test
      - run: pnpm --filter @argus/web build
      - run: pnpm --filter @argus/web check:links
      - run: pnpm --filter @argus/web exec lhci autorun --config=lighthouserc.json
      - run: |
          ! git ls-files | grep -E '(^|/)(\.env|state\.json|secrets\.env|argus\.yaml)$'
