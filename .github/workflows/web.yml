name: Web

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @argus/web generate
      - run: pnpm vitest run apps/web/test
      - run: pnpm --filter @argus/web build
      - run: pnpm --filter @argus/web check:links
      - run: pnpm --filter @argus/web exec lhci autorun --config=lighthouserc.json
      - run: |
          ! git ls-files | grep -E '(^|/)(\.env|state\.json|secrets\.env|argus\.yaml)$'
