name: SQLite volume diagnostic

on:
  workflow_dispatch:
    inputs:
      app_image:
        description: Digest-pinned Argus application image
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.16.0"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify named-volume snapshot and restore
        env:
          ARGUS_SQLITE_VOLUME_TEST: "1"
          ARGUS_APP_IMAGE: ${{ inputs.app_image }}
        run: |
          docker pull "$ARGUS_APP_IMAGE"
          pnpm vitest run packages/deployment/test/sqlite-volume.live.test.ts
