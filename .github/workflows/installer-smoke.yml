name: Installer smoke

on:
  workflow_run:
    workflows: ["Signed release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable published Argus release tag (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: installer-smoke-${{ github.event.workflow_run.head_branch || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      installer_url: ${{ steps.candidate.outputs.installer_url }}
      manifest_url: ${{ steps.candidate.outputs.manifest_url }}
      version: ${{ steps.candidate.outputs.version }}
      wrapper_sha256: ${{ steps.candidate.outputs.wrapper_sha256 }}
      source_ref: ${{ steps.candidate.outputs.source_ref }}
    steps:
      - name: Resolve immutable published candidate
        id: candidate
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch || inputs.release_tag }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          version="${RELEASE_TAG#v}"
          base="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 60 --retry 3 --retry-all-errors \
            --output manifest.json "${base}/manifest.json"
          test "$(jq -er '.version' manifest.json)" = "$version"
          wrapper_sha256="$(jq -er '.assets.wrapper.sha256' manifest.json)"
          [[ "$wrapper_sha256" =~ ^[a-f0-9]{64}$ ]]
          source_ref="${WORKFLOW_SHA:-$RELEASE_TAG}"
          [[ "$source_ref" =~ ^[a-f0-9]{40}$ || "$source_ref" = "$RELEASE_TAG" ]]
          printf 'installer_url=%s\nmanifest_url=%s\nversion=%s\nwrapper_sha256=%s\nsource_ref=%s\n' \
            "${base}/install.sh" "${base}/manifest.json" "$version" "$wrapper_sha256" \
            "$source_ref" \
            >> "$GITHUB_OUTPUT"

  smoke:
    needs: candidate
    name: ${{ matrix.os }} / ${{ matrix.arch }} / docker-${{ matrix.docker }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
            docker: present
            runner: ubuntu-24.04
            rootfs: docker.io/library/ubuntu@sha256:0e0a0fc6d18feda9db1590da249ac93e8d5abfea8f4c3c0c849ce512b5ef8982
          - os: ubuntu-24.04
            arch: amd64
            docker: absent
            runner: ubuntu-24.04
            rootfs: docker.io/library/ubuntu@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90
          - os: ubuntu-24.04
            arch: arm64
            docker: present
            runner: ubuntu-24.04-arm
            rootfs: docker.io/library/ubuntu@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90
          - os: ubuntu-26.04
            arch: arm64
            docker: present
            runner: ubuntu-24.04-arm
            rootfs: docker.io/library/ubuntu@sha256:3131b4cc82a783df6c9df078f86e01819a13594b865c2cad47bd1bca2b7063bb
          - os: debian-12
            arch: amd64
            docker: present
            runner: ubuntu-24.04
            rootfs: docker.io/library/debian@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818
          - os: debian-13
            arch: arm64
            docker: absent
            runner: ubuntu-24.04-arm
            rootfs: docker.io/library/debian@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.source_ref }}

      - name: Build immutable clean-host fixture
        env:
          ROOTFS: ${{ matrix.rootfs }}
          DOCKER_MODE: ${{ matrix.docker }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/smoke-host dist/smoke-artifacts
          for file in installer.log wrapper.sha256 compose.log doctor.json; do
            install -m 0600 /dev/null "dist/smoke-artifacts/$file"
          done
          cat > dist/smoke-host/Dockerfile <<'DOCKERFILE'
          ARG ROOTFS=docker.io/library/ubuntu@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90
          FROM ${ROOTFS}
          ARG TARGETARCH
          ARG DOCKER_MODE
          ARG DOCKER_VERSION=29.7.1
          ARG COMPOSE_VERSION=2.39.1
          RUN apt-get update \
            && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ca-certificates coreutils curl expect gnupg iproute2 iptables jq openssl \
              procps systemd systemd-sysv \
            && rm -rf /var/lib/apt/lists/*
          RUN if [ "$DOCKER_MODE" = present ]; then \
                case "$TARGETARCH" in \
                  amd64) asset_arch=x86_64; docker_sha=0fcea2a8b4d1b54ccc9010e3451b78504a369d414f37eb3bb79300e1b5c22ce6; compose_sha=a5ea28722d5da628b59226626f7d6c33c89a7ed19e39f750645925242044c9d2 ;; \
                  arm64) asset_arch=aarch64; docker_sha=4eb4d1b21131897ed3990aac31039161bf4bdd07fcfb733e996010319ff4e069; compose_sha=7b2627ed76f7dcb0d93f649f185af912372229b4c09762a3cd1db5be5255632b ;; \
                  *) exit 1 ;; \
                esac \
                && curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
                  "https://download.docker.com/linux/static/stable/${asset_arch}/docker-${DOCKER_VERSION}.tgz" \
                  --output /tmp/docker.tgz \
                && printf '%s  %s\n' "$docker_sha" /tmp/docker.tgz | sha256sum --check --strict \
                && tar -xzf /tmp/docker.tgz -C /tmp \
                && install -m 0755 /tmp/docker/* /usr/local/bin/ \
                && curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
                  "https://github.com/docker/compose/releases/download/v${COMPOSE_VERSION}/docker-compose-linux-${asset_arch}" \
                  --output /tmp/docker-compose \
                && printf '%s  %s\n' "$compose_sha" /tmp/docker-compose | sha256sum --check --strict \
                && install -D -m 0755 /tmp/docker-compose /usr/local/lib/docker/cli-plugins/docker-compose \
                && printf '%s\n' \
                  '[Unit]' \
                  'Description=Docker Application Container Engine' \
                  'After=network-online.target' \
                  '[Service]' \
                  'Type=notify' \
                  'ExecStart=/usr/local/bin/dockerd --host=unix:///var/run/docker.sock --storage-driver=vfs' \
                  'Restart=on-failure' \
                  '[Install]' \
                  'WantedBy=multi-user.target' \
                  > /etc/systemd/system/docker.service \
                && systemctl enable docker.service; \
              fi
          STOPSIGNAL SIGRTMIN+3
          CMD ["/sbin/init"]
          DOCKERFILE
          docker build \
            --build-arg "ROOTFS=$ROOTFS" \
            --build-arg "DOCKER_MODE=$DOCKER_MODE" \
            --tag "argus-smoke-host:${{ strategy.job-index }}" \
            dist/smoke-host

      - name: Start isolated clean host
        id: host
        env:
          DOCKER_MODE: ${{ matrix.docker }}
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /opt/argus
          container="argus-smoke-${{ strategy.job-index }}"
          args=(
            --detach
            --name "$container"
            --privileged
            --cgroupns host
            --tmpfs /run
            --tmpfs /run/lock
            --volume /sys/fs/cgroup:/sys/fs/cgroup:rw
            --volume /opt/argus:/opt/argus
            --volume "$PWD:/workspace:ro"
            --volume "$PWD/dist/smoke-artifacts:/artifacts"
          )
          docker run "${args[@]}" "argus-smoke-host:${{ strategy.job-index }}"
          printf 'container=%s\n' "$container" >> "$GITHUB_OUTPUT"
          for _ in {1..30}; do
            docker exec "$container" systemctl is-system-running --wait >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker exec "$container" systemctl --failed --no-pager
          exit 1

      - name: Verify signed install and onboarding
        env:
          CONTAINER: ${{ steps.host.outputs.container }}
          DOCKER_MODE: ${{ matrix.docker }}
          INSTALLER_URL: ${{ needs.candidate.outputs.installer_url }}
          MANIFEST_URL: ${{ needs.candidate.outputs.manifest_url }}
          EXPECTED_VERSION: ${{ needs.candidate.outputs.version }}
          WRAPPER_SHA256: ${{ needs.candidate.outputs.wrapper_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DOCKER_MODE" = absent ]; then
            docker exec "$CONTAINER" sh -c '! command -v docker'
            install_docker=1
          else
            docker exec "$CONTAINER" docker info >/dev/null
            docker exec "$CONTAINER" docker compose version >/dev/null
            install_docker=0
          fi
          docker exec \
            --env "ARGUS_INSTALLER_URL=$INSTALLER_URL" \
            --env "ARGUS_MANIFEST_URL=$MANIFEST_URL" \
            --env "ARGUS_EXPECTED_VERSION=$EXPECTED_VERSION" \
            --env "ARGUS_EXPECTED_WRAPPER_SHA256=$WRAPPER_SHA256" \
            --env "ARGUS_INSTALL_DOCKER=$install_docker" \
            --env "ARGUS_SMOKE_ARTIFACT_DIR=/artifacts" \
            "$CONTAINER" /workspace/scripts/e2e/installer-smoke.sh

      - name: Normalize allowlisted failure evidence
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/smoke-artifacts
          files=(
            dist/smoke-artifacts/installer.log
            dist/smoke-artifacts/wrapper.sha256
            dist/smoke-artifacts/compose.log
            dist/smoke-artifacts/doctor.json
          )
          sudo touch "${files[@]}"
          sudo chown "$(id -u):$(id -g)" "${files[@]}"
          chmod 0600 "${files[@]}"

      - name: Upload sanitized failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-smoke-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.docker }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/smoke-artifacts/installer.log
            dist/smoke-artifacts/wrapper.sha256
            dist/smoke-artifacts/compose.log
            dist/smoke-artifacts/doctor.json

      - name: Remove disposable host
        if: always()
        env:
          CONTAINER: ${{ steps.host.outputs.container }}
        run: |
          if [ -n "$CONTAINER" ]; then
            docker rm --force "$CONTAINER"
          fi
