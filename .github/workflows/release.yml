name: Signed release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      REGISTRY: ghcr.io
      APP_IMAGE: ghcr.io/gpsxtreme/argus
      CLI_IMAGE: ghcr.io/gpsxtreme/argus-cli
      POSTGRES_IMAGE: docker.io/library/postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
      SEARXNG_IMAGE: docker.io/searxng/searxng@sha256:ec536bcd1e83577aad4cc07f7ecb9a30858a9a905d2d57c8796abc83f872a036
      FXEMBED_REVISION: f088a632e56e5cb8084f87d55f74a24d1fcda6f6
      FXEMBED_LICENSE_SHA256: 30ee0a78e6df8c8210bbee02a477c57f2cf8c7db13a756ea577678aee7014d37
      FXEMBED_LOCK_SHA256: 88ae1a737ca41e9a7d69593fd9e82ad35dee90d4fabc51ae3c5b33d5868535bc
      FXEMBED_COMPATIBILITY_DATE: "2026-04-11"
      FXEMBED_PATCH: scripts/release/fxembed-reproducible.patch
      FXEMBED_PATCH_SHA256: cdbb1a5351286f19d3486d4921026bb751f939cd6e7b8aabba29bb2549609e1e
      FXEMBED_OUTPUT_SHA256: 1a9a52d5c49747cbcd2aec5c3aa593cffc02358f5fb01b2dc5542921d0012260
      NODE_VERSION: "24.16.0"
      NPM_VERSION: "11.13.0"
      PNPM_VERSION: "10.33.0"
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          pnpm install --frozen-lockfile

      - name: Install terminal test dependency
        run: sudo apt-get install -y expect

      - name: Validate immutable release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          version="${GITHUB_REF_NAME#v}"
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          release_base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          printf 'version=%s\nsource_date_epoch=%s\nrelease_base_url=%s\n' \
            "$version" "$source_date_epoch" "$release_base_url" >> "$GITHUB_OUTPUT"

      - name: Reserve immutable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists; immutable releases cannot be rerun."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes "Signed Argus release $GITHUB_REF_NAME"

      - name: Derive the public release key
        id: public-key
        env:
          ARGUS_RELEASE_ED25519_KEY: ${{ secrets.ARGUS_RELEASE_ED25519_KEY }}
        run: |
          set -euo pipefail
          mkdir -p dist/release
          node --input-type=module -e \
            'import { createPrivateKey, createPublicKey } from "node:crypto";
             import { writeFileSync } from "node:fs";
             const key = createPrivateKey(process.env.ARGUS_RELEASE_ED25519_KEY);
             if (key.asymmetricKeyType !== "ed25519") throw new Error("release key is not Ed25519");
             const pem = createPublicKey(key).export({ type: "spki", format: "pem" }).toString();
             writeFileSync("dist/release/release-public.pem", pem, { mode: 0o644 });
             writeFileSync(process.env.GITHUB_OUTPUT, `b64=${Buffer.from(pem).toString("base64")}\n`, { flag: "a" });'

      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: ARGUS_REQUIRE_EXPECT_TESTS=1 pnpm test
      - name: Build
        run: pnpm build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application image
        id: app
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.APP_IMAGE }}:${{ steps.release.outputs.version }}
          build-args: |
            ARGUS_VERSION=${{ steps.release.outputs.version }}
            ARGUS_REVISION=${{ github.sha }}

      - name: Verify SQLite named-volume backup and restore
        env:
          ARGUS_SQLITE_VOLUME_TEST: "1"
          ARGUS_APP_IMAGE: ${{ env.APP_IMAGE }}@${{ steps.app.outputs.digest }}
        run: |
          docker pull "$ARGUS_APP_IMAGE"
          pnpm vitest run packages/deployment/test/sqlite-volume.live.test.ts

      - name: Build and push management image
        id: cli
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: deploy/docker/Dockerfile.cli
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.CLI_IMAGE }}:${{ steps.release.outputs.version }}
          build-args: |
            ARGUS_VERSION=${{ steps.release.outputs.version }}
            ARGUS_REVISION=${{ github.sha }}
            ARGUS_RELEASE_PUBLIC_KEY_B64=${{ steps.public-key.outputs.b64 }}
            ARGUS_RELEASE_MANIFEST_URL=${{ steps.release.outputs.release_base_url }}/manifest.json
            ARGUS_UPDATE_MANIFEST_URL=https://argus.gpsxtre.me/releases/stable/manifest.json

      - name: Build pinned FxEmbed worker
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/FxEmbed/FxEmbed.git dist/fxembed-source
          git -C dist/fxembed-source checkout --detach "$FXEMBED_REVISION"
          test "$(git -C dist/fxembed-source rev-parse HEAD)" = "$FXEMBED_REVISION"
          printf '%s  %s\n' "$FXEMBED_LICENSE_SHA256" dist/fxembed-source/LICENSE.md | sha256sum --check --strict
          printf '%s  %s\n' "$FXEMBED_LOCK_SHA256" dist/fxembed-source/package-lock.json | sha256sum --check --strict
          printf '%s  %s\n' "$FXEMBED_PATCH_SHA256" "$FXEMBED_PATCH" | sha256sum --check --strict
          git -C dist/fxembed-source apply --check "$GITHUB_WORKSPACE/$FXEMBED_PATCH"
          git -C dist/fxembed-source apply "$GITHUB_WORKSPACE/$FXEMBED_PATCH"
          SOURCE_DATE_EPOCH="$(git -C dist/fxembed-source show -s --format=%ct "$FXEMBED_REVISION")"
          [[ "$SOURCE_DATE_EPOCH" =~ ^(0|[1-9][0-9]*)$ ]]
          export SOURCE_DATE_EPOCH
          (
            cd dist/fxembed-source
            test "$(node --version)" = "v${NODE_VERSION}"
            test "$(npm --version)" = "${NPM_VERSION}"
            npm ci --ignore-scripts
            npm run build:atmosphere
            npm run build-local
          )
          install -m 0644 dist/fxembed-source/dist/worker.js dist/release/fxembed.js
          printf '%s  %s\n' "$FXEMBED_OUTPUT_SHA256" dist/release/fxembed.js | sha256sum --check --strict
          install -m 0644 dist/fxembed-source/LICENSE.md dist/release/FXEMBED-LICENSE.md
          install -m 0644 scripts/release/fxembed-provenance.json dist/release/fxembed-provenance.json

      - name: Render digest-pinned host wrapper
        run: |
          pnpm tsx scripts/release/export-wrapper.ts \
            --output dist/release/argus

      - name: Build and verify signed assets
        env:
          ARGUS_RELEASE_ED25519_KEY: ${{ secrets.ARGUS_RELEASE_ED25519_KEY }}
        run: |
          pnpm tsx scripts/release/create-manifest.ts \
            --version "${{ steps.release.outputs.version }}" \
            --source-date-epoch "${{ steps.release.outputs.source_date_epoch }}" \
            --image "app=${APP_IMAGE}@${{ steps.app.outputs.digest }}" \
            --image "cli=${CLI_IMAGE}@${{ steps.cli.outputs.digest }}" \
            --image "postgres=${POSTGRES_IMAGE}" \
            --image "searxng=${SEARXNG_IMAGE}" \
            --fxembed dist/release/fxembed.js \
            --fxembed-license dist/release/FXEMBED-LICENSE.md \
            --fxembed-provenance dist/release/fxembed-provenance.json \
            --fxembed-compatibility-date "$FXEMBED_COMPATIBILITY_DATE" \
            --wrapper dist/release/argus \
            --release-base-url "${{ steps.release.outputs.release_base_url }}" \
            --output-dir dist/release
          pnpm tsx scripts/release/verify-manifest.ts \
            dist/release/manifest.json \
            dist/release/manifest.sig \
            dist/release/release-public.pem
          sh -n dist/release/argus
          sh -n dist/release/install.sh

      - name: Upload verified stable-promotion input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-promotion-input
          if-no-files-found: error
          path: |-
            dist/release/manifest.json
            dist/release/manifest.sig
            dist/release/release-public.pem
            dist/release/argus
            dist/release/install.sh
            dist/release/fxembed.js
            dist/release/FXEMBED-LICENSE.md
            dist/release/fxembed-provenance.json

      - name: Publish immutable GitHub Release
        uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7 # v2.3.4
        with:
          overwrite_files: false
          draft: false
          fail_on_unmatched_files: true
          files: |
            dist/release/manifest.json
            dist/release/manifest.sig
            dist/release/release-public.pem
            dist/release/install.sh
            dist/release/argus
            dist/release/fxembed.js
            dist/release/FXEMBED-LICENSE.md
            dist/release/fxembed-provenance.json
