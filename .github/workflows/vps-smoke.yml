name: VPS smoke

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable signed Argus release tag
        required: true
        type: string
      controlled_web_url:
        description: Public HTTPS page controlled by the Argus project
        required: true
        default: https://argus.gpsxtre.me/
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: vps-smoke-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    outputs:
      installer_url: ${{ steps.release.outputs.installer_url }}
      manifest_url: ${{ steps.release.outputs.manifest_url }}
      manifest_asset_url: ${{ steps.release.outputs.manifest_asset_url }}
      installer_sha256: ${{ steps.release.outputs.installer_sha256 }}
      version: ${{ steps.release.outputs.version }}
      update_manifest_asset_url: ${{ steps.release.outputs.update_manifest_asset_url }}
      update_manifest_sha256: ${{ steps.release.outputs.update_manifest_sha256 }}
      update_version: ${{ steps.release.outputs.update_version }}
      acceptance_mode: ${{ steps.release.outputs.acceptance_mode }}
    steps:
      - name: Check out trusted acceptance tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install trusted verification dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve immutable signed release assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh api "repos/${REPOSITORY}/releases/tags/${RELEASE_TAG}" > release.json
          jq -e '.draft == false' release.json >/dev/null
          gh api --paginate --slurp "repos/${REPOSITORY}/releases?per_page=100" > releases.json
          target_version=$(printf '%s' "${RELEASE_TAG#v}" | jq -R 'split(".") | map(tonumber)')
          asset_url() {
            local release=$1 name=$2
            test "$(jq --arg name "$name" '[.assets[] | select(.name == $name and .state == "uploaded")] | length' "$release")" -eq 1
            jq -er --arg name "$name" '.assets[] | select(.name == $name and .state == "uploaded") | .url' "$release"
          }
          download_release_directory() {
            local release=$1 directory=$2 name
            mkdir -p "$directory"
            for name in manifest.json manifest.sig release-public.pem install.sh argus; do
              gh api --header 'Accept: application/octet-stream' \
                "$(asset_url "$release" "$name")" > "$directory/$name"
            done
          }
          target_manifest_asset_url=$(asset_url release.json manifest.json)
          download_release_directory release.json target-release
          pnpm tsx scripts/e2e/release-acceptance-policy.ts \
            verify-release target-release > target-release/acceptance.json
          test "$(jq -er '.version' target-release/acceptance.json)" = "${RELEASE_TAG#v}"
          test "$(jq -er '.durable' target-release/acceptance.json)" = true
          target_manifest_sha256=$(sha256sum target-release/manifest.json | awk 'NR == 1 { print $1 }')
          [[ "$target_manifest_sha256" =~ ^[a-f0-9]{64}$ ]]
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            'https://argus.gpsxtre.me/releases/stable/manifest.json' \
            --output stable-manifest.json
          cmp -s target-release/manifest.json stable-manifest.json
          jq -r --argjson target "$target_version" '
            [ .[] | .[]
              | select(.draft == false and .prerelease == false)
              | .tag_name as $tag
              | select($tag | test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))
              | ($tag | capture("^v(?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)$")
                 | [.major, .minor, .patch | tonumber]) as $version
              | select($version < $target)
              | { tag: $tag, version: $version }
            ] | sort_by(.version) | reverse | .[].tag
          ' releases.json > earlier-release-tags.txt
          : > durable-release-tags.txt
          while IFS= read -r baseline_tag; do
            gh api "repos/${REPOSITORY}/releases/tags/${baseline_tag}" > baseline-release.json
            baseline_directory="baseline-${baseline_tag#v}"
            if download_release_directory baseline-release.json "$baseline_directory" && \
              pnpm tsx scripts/e2e/release-acceptance-policy.ts \
                verify-release "$baseline_directory" > "$baseline_directory/acceptance.json" && \
              test "$(jq -er '.version' "$baseline_directory/acceptance.json")" = "${baseline_tag#v}" && \
              test "$(jq -er '.durable' "$baseline_directory/acceptance.json")" = true
            then
              printf '%s\n' "$baseline_tag" >> durable-release-tags.txt
              break
            fi
          done < earlier-release-tags.txt
          jq -Rsc 'split("\n") | map(select(length > 0))' durable-release-tags.txt > durable-release-tags.json
          acceptance_plan=$(pnpm tsx scripts/e2e/release-acceptance-policy.ts select-baseline --target "$RELEASE_TAG" --durable-tags durable-release-tags.json)
          acceptance_mode=$(printf '%s' "$acceptance_plan" | jq -er '.mode')
          update_manifest_asset_url=
          update_manifest_sha256=
          update_version=
          if [ "$acceptance_mode" = update ]; then
            baseline_tag=$(printf '%s' "$acceptance_plan" | jq -er '.baselineTag')
            gh api "repos/${REPOSITORY}/releases/tags/${baseline_tag}" > baseline-release.json
            installer_release=baseline-release.json
            installer_tag=$baseline_tag
            installer_acceptance="baseline-${baseline_tag#v}/acceptance.json"
            update_manifest_asset_url=$target_manifest_asset_url
            update_manifest_sha256=$target_manifest_sha256
            update_version=${RELEASE_TAG#v}
          else
            test "$acceptance_mode" = bootstrap
            installer_release=release.json
            installer_tag=$RELEASE_TAG
            installer_acceptance=target-release/acceptance.json
          fi
          printf 'installer_url=%s\nmanifest_url=%s\nmanifest_asset_url=%s\ninstaller_sha256=%s\nversion=%s\nupdate_manifest_asset_url=%s\nupdate_manifest_sha256=%s\nupdate_version=%s\nacceptance_mode=%s\n' \
            "$(asset_url "$installer_release" install.sh)" \
            "https://github.com/${REPOSITORY}/releases/download/${installer_tag}/manifest.json" \
            "$(asset_url "$installer_release" manifest.json)" \
            "$(jq -er '.installerSha256' "$installer_acceptance")" \
            "${installer_tag#v}" \
            "$update_manifest_asset_url" \
            "$update_manifest_sha256" \
            "$update_version" \
            "$acceptance_mode" >> "$GITHUB_OUTPUT"

  vps_smoke:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rootfs:
          - ubuntu:24.04
          - debian:13
    steps:
      - name: Check out the harness under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify clean VPS onboarding and operation
        env:
          ARGUS_VPS_E2E: "1"
          ARGUS_INSTALLER_URL: ${{ needs.candidate.outputs.installer_url }}
          ARGUS_MANIFEST_URL: ${{ needs.candidate.outputs.manifest_url }}
          ARGUS_MANIFEST_ASSET_URL: ${{ needs.candidate.outputs.manifest_asset_url }}
          ARGUS_EXPECTED_INSTALLER_SHA256: ${{ needs.candidate.outputs.installer_sha256 }}
          ARGUS_EXPECTED_VERSION: ${{ needs.candidate.outputs.version }}
          ARGUS_VPS_SMOKE_MODE: ${{ needs.candidate.outputs.acceptance_mode }}
          ARGUS_UPDATE_MANIFEST_ASSET_URL: ${{ needs.candidate.outputs.update_manifest_asset_url }}
          ARGUS_UPDATE_MANIFEST_SHA256: ${{ needs.candidate.outputs.update_manifest_sha256 }}
          ARGUS_UPDATE_EXPECTED_VERSION: ${{ needs.candidate.outputs.update_version }}
          ARGUS_CONTROLLED_WEB_URL: ${{ inputs.controlled_web_url }}
          ARGUS_GITHUB_TOKEN: ${{ github.token }}
          ARGUS_GITHUB_USER: ${{ github.actor }}
        run: scripts/e2e/vps-smoke.sh "${{ matrix.rootfs }}"
