name: VPS smoke

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable signed Argus release tag
        required: true
        type: string
      controlled_web_url:
        description: Public HTTPS page controlled by the Argus project
        required: true
        default: https://argus.gpsxtre.me/
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: vps-smoke-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    outputs:
      installer_url: ${{ steps.release.outputs.installer_url }}
      manifest_url: ${{ steps.release.outputs.manifest_url }}
      manifest_asset_url: ${{ steps.release.outputs.manifest_asset_url }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve immutable signed release assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh api "repos/${REPOSITORY}/releases/tags/${RELEASE_TAG}" > release.json
          jq -e '.draft == false' release.json >/dev/null
          asset_url() {
            local name=$1
            test "$(jq --arg name "$name" '[.assets[] | select(.name == $name and .state == "uploaded")] | length' release.json)" -eq 1
            jq -er --arg name "$name" '.assets[] | select(.name == $name and .state == "uploaded") | .url' release.json
          }
          printf 'installer_url=%s\nmanifest_url=%s\nmanifest_asset_url=%s\nversion=%s\n' \
            "$(asset_url install.sh)" \
            "https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/manifest.json" \
            "$(asset_url manifest.json)" \
            "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  vps_smoke:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rootfs:
          - ubuntu:24.04
          - debian:13
    steps:
      - name: Check out the harness under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify clean VPS onboarding and operation
        env:
          ARGUS_VPS_E2E: "1"
          ARGUS_INSTALLER_URL: ${{ needs.candidate.outputs.installer_url }}
          ARGUS_MANIFEST_URL: ${{ needs.candidate.outputs.manifest_url }}
          ARGUS_MANIFEST_ASSET_URL: ${{ needs.candidate.outputs.manifest_asset_url }}
          ARGUS_EXPECTED_VERSION: ${{ needs.candidate.outputs.version }}
          ARGUS_CONTROLLED_WEB_URL: ${{ inputs.controlled_web_url }}
          ARGUS_GITHUB_TOKEN: ${{ github.token }}
          ARGUS_GITHUB_USER: ${{ github.actor }}
        run: scripts/e2e/vps-smoke.sh "${{ matrix.rootfs }}"
